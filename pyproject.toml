[project]
name = "bwpro"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "prompt-toolkit>=3.0.53",
    "pyside6>=6.12.0",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
