[project]
name = "bwpro"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
