id: 100124
version: 20260724
name: 妖琴师
faction: 苍叶
power: 3
health: 4
ability:
  # 静态倒计时能力块（对局开始/升至1级/复活时注册）：[倒计时3] 己方所有角色恢复3生命
  countdown: 3
  steps:
    - {op: heal, amount: 3, target: {kind: all, pool: friendly_shikigami}}
    - {op: heal, amount: 3, target: {kind: all, pool: self_player}}
abilities:
  # 使用妖琴师的觉醒法术牌时：妖琴师倒计时-3（觉醒替换后由觉醒能力块的同名触发接续；
  # 新倒计时 initial 3 被同次 -3 减到 0 时立即走归零流程）
  - when: on_card_played
    condition: {player: self, card_type: spell, subtype: awaken, shikigami: 100124}
    steps:
      - {op: countdown_delta, amount: -3, target: {kind: self}}
text: "[倒计时3]：{为己方所有角色恢复3生命}。当你使用妖琴师的[觉醒]法术牌时，使妖琴师的倒计时-3。"
