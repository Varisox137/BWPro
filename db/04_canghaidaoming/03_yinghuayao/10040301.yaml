        # 卡牌自身 effects 块 ctx.event 为 None，不可用）
      methods:
        - id: damage
          target: {kind: choose, pool: enemy_shikigami}
          effects:
            steps:
              - {op: damage, amount: 3}
          text: 对一个敌方式神造成3点伤害
        - id: heal
          # 含未离场气绝己方式神（include_defeated choose 口径，spec_pool_refs）；
          # allow_defeated 配合基础能力转化通道（气绝→倒计时-1）
          target: {kind: choose, pool: friendly_shikigami, include_defeated: true}
          effects:
            steps:
              - {op: heal, amount: 6, allow_defeated: true}
          text: 对一个己方式神恢复6点生命
      text: "对一个敌方式神造成3点伤害，或对一个己方式神恢复6点生命。"
