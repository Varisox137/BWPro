id: 10040306
name: 花云之誓
versions:
  best: 20200928
  history:
    - date: 20200928  # 发布日期
      card_type: spell
      rarity: R
      level: 2
      effects:
        steps:
          # 随机一项、重复6次（repeat 包裹 random_branch，惊鸿之舞 10020208 先例；
          # 每轮重新随机分支与目标）
          - op: repeat
            count: 6
            steps:
              - op: random_branch
                branches:
                  # 为一个己方角色恢复2点生命（角色含牌手）
                  - condition: null
                    steps:
                      - {op: heal, amount: 2,
                         target: {kind: all, pool: friendly_character, random: 1}}
                  # 对一个敌方角色造成1点伤害
                  - condition: null
                    steps:
                      - {op: damage, amount: 1,
                         target: {kind: all, pool: enemy_character, random: 1}}
      text: "随机一项：为一个己方角色恢复2点生命；或对一个敌方角色造成1点伤害。重复6次。"
