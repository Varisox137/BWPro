id: 10040307
name: 樱吹雪
versions:
  best: 20200928
  history:
    - date: 20200928  # 发布日期
      card_type: spell
      rarity: SR
      level: 3
      effects:
        # "其他所有式神"= 双方除樱花妖外的式神（含未离场气绝者：include_defeated）。
        # resolve 的 include_defeated 仅支持 friendly/enemy_shikigami 单侧池，故伤害段
        # 与治疗段各拆敌我两步；repeat_on_kill/repeat_on_revive 的"重复此效果"按步
        # 各自重复（引擎上限 10 次），与整段一起重复原版语义在连环击杀/复活跨敌我
        # 交替时有细微次序差异（待确认见 questions.md 指针）
        steps:
          # 对其他所有式神造成2点伤害，若击杀式神则重复此效果
          - {op: damage, amount: 2, repeat_on_kill: true, allow_defeated: true,
             target: {kind: all, pool: enemy_shikigami, include_defeated: true}}
          - {op: damage, amount: 2, repeat_on_kill: true, allow_defeated: true,
             target: {kind: all, pool: friendly_shikigami, include_defeated: true,
                      exclude_shikigami: 100403}}
          # 恢复其他所有式神3点生命，若复活式神则重复此效果
          - {op: heal, amount: 3, repeat_on_revive: true, allow_defeated: true,
             target: {kind: all, pool: enemy_shikigami, include_defeated: true}}
          - {op: heal, amount: 3, repeat_on_revive: true, allow_defeated: true,
             target: {kind: all, pool: friendly_shikigami, include_defeated: true,
                      exclude_shikigami: 100403}}
      text: "对其他所有式神造成2点伤害，若击杀式神则重复此效果。恢复其他所有式神3点生命，若复活式神则重复此效果。"
