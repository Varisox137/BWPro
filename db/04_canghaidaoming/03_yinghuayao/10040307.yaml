id: 10040307
name: 樱吹雪
versions:
  best: 20200928
  history:
    - date: 20200928  # 发布日期
      card_type: spell
      rarity: SR
      level: 3
      effects:
        # 0928 改版：伤害池=所有敌方式神（enemy_shikigami）、治疗池=所有己方式神
        # （friendly_shikigami 含樱花妖自己）；气绝者入池按樱花妖门控（定案(2)
        # include_defeated_kw：己方气绝 iff 基础/觉醒能力在场、敌方气绝 iff 觉醒在场）。
        # "重复此效果一次"= 至多重复 1 次（repeat_on_kill/repeat_on_revive=1，
        # 0928 起非无限循环）；伤害段全部重复完才进治疗段。
        # 气绝目标走转化通道、按结算时能力在场判定（答复(3)）：伤害波对气绝**敌方**
        # 仅觉醒（damage_defeated_countdown）转化倒计时+1，未觉醒管线拦截空过；
        # 治疗波对气绝**己方**按 heal_defeated_countdown（基础/觉醒）转化-1（减到 0
        # 复活→触发整波重复），结算时樱花妖能力离场（气绝/离场）则不转化。
        steps:
          # 对所有敌方式神造成2点伤害，若击杀式神，重复此效果一次
          - {op: damage, amount: 2, repeat_on_kill: 1,
             target: {kind: all, pool: enemy_shikigami, include_defeated_kw: true}}
          # 为所有己方式神恢复3点生命，若复活式神，重复此效果一次
          - {op: heal, amount: 3, repeat_on_revive: 1,
             target: {kind: all, pool: friendly_shikigami, include_defeated_kw: true}}
      text: "对所有敌方式神造成2点伤害，若击杀式神，重复此效果一次。为所有己方式神恢复3点生命，若复活式神，重复此效果一次。"
