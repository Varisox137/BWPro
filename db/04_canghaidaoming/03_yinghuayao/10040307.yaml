id: 10040307
name: 樱吹雪
versions:
  best: 20200928
  history:
    - date: 20200928  # 发布日期
      card_type: spell
      rarity: SR
      level: 3
      effects:
        # "其他所有式神"= 双方除樱花妖外的式神（any_shikigami + exclude_shikigami
        # 按数据 id 排除——镜像对局敌我同名樱花妖均被排除），含未离场气绝者
        # （include_defeated，any_shikigami 池扩展）。维护者定案（thoughts 答复(2)）：
        # 伤害/治疗均不区分敌我，结算为"并行伤害，若击杀则再来一次并行伤害；然后
        # 并行治疗，若复活则再来一次"——单一并行波次 + repeat_on_kill/repeat_on_revive
        # 整波重复（引擎上限 10 次），伤害段全部重复完才进治疗段。
        # 气绝目标走转化通道、按结算时能力在场判定（答复(3)）：伤害波对气绝**敌方**
        # 仅觉醒（damage_defeated_countdown）转化倒计时+1，未觉醒管线拦截空过；
        # 治疗波对气绝**己方**按 heal_defeated_countdown（基础/觉醒）转化-1（减到 0
        # 复活→触发整波重复），结算时樱花妖能力离场（气绝/离场）则不转化；气绝敌方
        # 不受治疗转化（伪关键字通道仅己方）。
        steps:
          # 对其他所有式神造成2点伤害，若击杀式神则重复此效果
          - {op: damage, amount: 2, repeat_on_kill: true,
             target: {kind: all, pool: any_shikigami, include_defeated: true,
                      exclude_shikigami: 100403}}
          # 恢复其他所有式神3点生命，若复活式神则重复此效果
          - {op: heal, amount: 3, repeat_on_revive: true,
             target: {kind: all, pool: any_shikigami, include_defeated: true,
                      exclude_shikigami: 100403}}
      text: "对其他所有式神造成2点伤害，若击杀式神则重复此效果。恢复其他所有式神3点生命，若复活式神则重复此效果。"
