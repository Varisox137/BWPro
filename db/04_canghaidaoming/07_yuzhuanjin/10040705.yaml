id: 10040705
name: 封魔符
versions:
  best: 20200928
  history:
    - date: 20200928  # 发布日期
      card_type: spell
      subtype: talisman
      rarity: R
      level: 2
      keywords: [trigger]
      target: {kind: choose, pool: enemy_shikigami}
      methods:
        # 符咒自带[爆能3]转化战斗牌（同 10040701 注释——单卡自带，觉醒免疫
        # 由觉醒能力同 id 键级合并追加）
        - id: burst
          energy_cost: 3
          card_type: combat
          target: {kind: choose, pool: enemy_shikigami, battle: true}
          power: 1
          shield: 1
          text: "爆能使用时变为战斗牌‘封魔箭’：+1/+1"
      effects:
        # [眩晕]一个敌方式神并使其本回合力量变为0（stun + power_override
        # scope=turn 半回合作用域；一太郎之棒 10020608 同型）
        steps:
          - {op: stun}
          - {op: power_override, "on": true, scope: turn}
      response:
        # [响应]：当御馔津被攻击时自动对攻击她的式神使用（on_before_assault
        # 事件 victim=御馔津，响应目标=事件 attacker；不弃 10040203 同型）
        when: on_before_assault
        condition: {victim_shikigami: 100407}
        steps:
          - {op: stun, target: {kind: context, key: attacker}}
          - {op: power_override, "on": true, scope: turn,
             target: {kind: context, key: attacker}}
      text: "[眩晕]一个敌方式神并使其本回合力量变为0。[响应]：{当御馔津被攻击时，自动对攻击她的式神使用。}"
