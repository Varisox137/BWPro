id: 10040607
name: 食梦
versions:
  best: 20200928
  history:
    - date: 20200928  # 发布日期
      card_type: spell
      rarity: R
      level: 3
      effects:
        # 随机使敌方牌库里三张牌结附'梦魇'，然后你恢复等同于其牌库中'梦魇'
        # 总数量的生命（"然后"= 步骤顺序：先结附后计数治疗，新结附的三张
        # 计入总数；deck_invocation_count 动态数值键——_step_amount）
        steps:
          - {op: attach_deck_invocation, name: 梦魇, count: 3}
          - {op: heal,
             amount: {deck_invocation_count: {name: 梦魇, side: enemy}},
             target: {kind: all, pool: self_player}}
      text: "随机使敌方牌库里三张牌结附‘梦魇’，然后你恢复等同于其牌库中‘梦魇’总数量的生命。"
