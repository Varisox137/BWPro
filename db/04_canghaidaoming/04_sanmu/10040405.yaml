id: 10040405
name: 二帚流
versions:
  best: 20200928
  history:
    - date: 20200928  # 发布日期
      card_type: combat
      rarity: R
      level: 2
      effects:
        steps:
          # 本次战斗三目获得免疫所有伤害（battle_immunity kind=all：战斗作用域，
          # 反击/效果伤害同样免疫，战斗外不免疫）+ 攻击5次（multi_strike 提取步：
          # 交战阶段后追加 4 段，反击只一段与首段并行，2-5 段依次单独结算）
          - {op: battle_immunity, kind: all, target: {kind: self}}
          - {op: multi_strike, times: 5}
      temp_grants:
        # 造成伤害时伤害改为1（uses: 5 覆盖五段攻击；override_damage 直接改写不封顶）
        - when: on_damage_start
          uses: 5
          condition: {source_shikigami: self}
          steps:
            - {op: override_damage, to: 1}
      text: "本次战斗三目获得免疫所有伤害且造成伤害时伤害改为1。攻击5次。"
