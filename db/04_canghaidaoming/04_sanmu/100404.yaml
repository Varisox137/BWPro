id: 100404
name: 三目
versions:
  best: 20200928
  history:
    - date: 20200928  # 发布日期
      faction: 紫岩
      power: 2
      health: 5
      abilities:
        # 游戏开始时，随机将一张'紧急委托'置入手牌（0 级未在场也触发——开局必然未升级，
        # 书翁同型）；generate card_ids 从指定 id 列表随机一张（可生成衍生牌）
        - when: on_game_start
          trigger_when_not_in_play: true
          steps:
            - {op: generate, card_ids: [10040451, 10040452, 10040453, 10040454]}
        # 三目使用紧急委托时，随机将一张'紧急委托'置入手牌（on_card_played payload
        # card_id 数据 id 列表等值匹配；裁决(11)：基础/觉醒能力气绝时整体失效——
        # 紧急委托使用事件中插入结算使三目气绝则不再获得新委托；on_card_played
        # 延时时机，置入在该使用事件完成后执行）
        - when: on_card_played
          condition: {player: self, card_id: [10040451, 10040452, 10040453, 10040454]}
          steps:
            - {op: generate, card_ids: [10040451, 10040452, 10040453, 10040454]}
      text: "游戏开始时或三目使用紧急委托时，随机将一张‘紧急委托’置入手牌。"
