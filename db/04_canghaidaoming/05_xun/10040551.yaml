id: 10040551
name: 鸮鸣
versions:
  best: 20200928
  history:
    - date: 20200928  # 发布日期（协战牌，随 04 沧海刀鸣引入；raw 标未加入=不进历史环境）
      card_type: field
      token: true  # 协战子选项（鸮羽共鸣 薰侧；本体未入库）
      level: 1
      intensity: 5
      effects:
        # [羁绊]：进场时山风倒计时-2（countdown_delta 指定式神先例 10030702；
        # 无倒计时能力者修正 -0 空操作；shikigami_active 门控）
        steps:
          - {op: countdown_delta, amount: -2, shikigami: 100307,
             condition: {shikigami_active: 100307}}
      abilities:
        # 每当己方具'鸮之守护'的式神发起攻击时，该式神获得+1力量直到回合结束
        # （attacker_has_invocation=攻击者本人结附门控，通用后缀具名实例；
        # turn_mark count=True 累计本回合触发次数）
        - when: on_before_assault
          condition: {attacker_side: friendly, attacker_has_invocation: 鸮之守护}
          steps:
            - {op: buff_power, amount: 1, scope: turn,
               target: {kind: context, key: attacker}}
            - {op: turn_mark, key: xiaoming, count: true}
        # 若是本回合第二次触发则抽一张牌（turn_count_eq=恰第 2 次触发；收集阶段
        # 求值——同事件先结算的计数步对本块不可见，第二次攻击事件收集时计数=1）
        - when: on_before_assault
          condition: {attacker_side: friendly, attacker_has_invocation: 鸮之守护,
                      turn_count_eq: {key: xiaoming, count: 1}}
          steps:
            - {op: draw, count: 1}
      text: "每当己方具‘鸮之守护’的式神发起攻击时，该式神获得+1力量直到回合结束，若是本回合第二次触发则抽一张牌。[羁绊]：{进场时山风倒计时-2。}"
