id: 10040506
name: 觉醒·薰
versions:
  best: 20200928
  history:
    - date: 20200928  # 发布日期
      card_type: spell
      subtype: awaken
      awaken_power: 1
      awaken_health: 1
      rarity: SR
      level: 2
      effects:
        steps: []
      abilities:
        # 当你的式神行动时，结附'鸮之守护'（"行动"=主动出击或使用专属牌，双块）：
        # 出击侧挂 on_after_assault 结附事件攻击者；用牌侧挂 on_card_played
        # （shikigami_not: null 排除中立牌），目标走行动账本 last_acted——出牌
        # 流程先记账再 emit on_card_played，故即本牌所属式神
        - when: on_after_assault
          condition: {attacker_side: friendly}
          steps:
            - {op: attach_invocation, name: 鸮之守护,
               target: {kind: context, key: attacker}}
        - when: on_card_played
          condition: {player: self, shikigami_not: null}
          steps:
            - {op: attach_invocation, name: 鸮之守护,
               target: {kind: context, key: last_acted}}
      text: "[觉醒]：{当你的式神行动时，结附‘鸮之守护’。}"
