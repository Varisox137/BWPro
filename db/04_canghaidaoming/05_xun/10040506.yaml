name: 觉醒·薰
versions:
  best: 20200928
  history:
    - date: 20200928  # 发布日期
      card_type: spell
      subtype: awaken
      awaken_power: 1
      awaken_health: 1
      rarity: SR
      level: 2
      effects:
        steps: []
      abilities:
        # 当你的式神攻击时，结附'鸮之守护'（触发时机 = 攻击事件流程的"攻击前"
        # on_before_assault，优先级 1——结附先于战斗伤害）：出击与战斗牌攻击都走
        # 该时机（统一入口 _resolve_combat → _battle_flow），目标 = 事件攻击者
        - when: on_before_assault
          priority: 1
          condition: {attacker_side: friendly}
          steps:
            - {op: attach_invocation, name: 鸮之守护,
               target: {kind: context, key: attacker}}
      text: "[觉醒]：{当你的式神攻击时，结附‘鸮之守护’。}"
