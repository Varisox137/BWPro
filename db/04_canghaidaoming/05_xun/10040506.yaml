id: 10040506
name: 觉醒·薰
versions:
  best: 20200928
  history:
    - date: 20200928  # 发布日期
      card_type: spell
      subtype: awaken
      awaken_power: 1
      awaken_health: 1
      rarity: SR
      level: 2
      effects:
        steps: []
      abilities:
        # 当你的式神行动时，结附'鸮之守护'（维护者定案(11)：触发时机 = 主动使用牌
        # 流程的"行动前"即时时机 + 出击事件流程的"出击前"（优先级 1））：
        # 出击侧挂 on_before_assault priority 1 结附事件攻击者；用牌侧挂
        # on_before_card_played（鬼火消耗后、使用事件结算前，仅主动使用发），
        # 目标 = 事件 actor（本牌所属式神；shikigami_not: null 排除中立牌）
        - when: on_before_assault
          priority: 1
          condition: {attacker_side: friendly}
          steps:
            - {op: attach_invocation, name: 鸮之守护,
               target: {kind: context, key: attacker}}
        - when: on_before_card_played
          condition: {player: self, shikigami_not: null}
          steps:
            - {op: attach_invocation, name: 鸮之守护,
               target: {kind: context, key: actor}}
      text: "[觉醒]：{当你的式神行动时，结附‘鸮之守护’。}"
