  history:
    - date: 20200928  # 发布日期
      card_type: spell
      subtype: awaken
      awaken_power: 0
      awaken_health: 2
      rarity: SR
      level: 3
      # 人面树的力量等于其生命（能力伪关键字，觉醒时按 ABILITY_PSEUDO_KEYWORDS
      # 集合换绑——移除基础式神的、授予觉醒牌的；覆写口径同 power_equal_shield）
      keywords: [power_eq_health]
      effects:
        steps: []
      abilities:
        # 敌方回合开始时，恢复全部生命（同基础能力；觉醒替换能力块整体换绑）
        - when: on_turn_start
          condition: {active: enemy}
          steps:
            - {op: heal, full: true, target: {kind: self}}
      text: "[觉醒]：{人面树的力量等于其生命。敌方回合开始时，恢复全部生命。}"
