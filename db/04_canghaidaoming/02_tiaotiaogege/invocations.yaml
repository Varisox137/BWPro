# 灵咒定义（loader 特判收集；text 逐字 = card_data_raw.md 引号内原文）
invocations:
  - name: 迟钝
    versions:
      best: 20200928
      history:
        - date: 20200928  # 发布日期（随 04 沧海刀鸣引入）
          keywords: [stun]  # [眩晕]：结附期间持有者眩晕（灵咒移除即解除）
          abilities:
            - countdown: 2  # [倒计时2]：{发起一次攻击}。生效后移除。
              once: true  # 一次型：归零生效后连同灵咒本体一并移除
              steps:
                - op: launch_attack  # 不耗火/出击次数、不查眩晕——正合眩晕中发起攻击
          text: "[倒计时2]：{发起一次攻击}。生效后移除。[眩晕]。"
