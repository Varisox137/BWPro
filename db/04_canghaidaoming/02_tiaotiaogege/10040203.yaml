id: 10040203
name: 不弃
versions:
  best: 20200928
  history:
    - date: 20200928  # 发布日期
      card_type: spell
      rarity: R
      level: 1
      keywords: [trigger]
      target: {kind: choose, pool: any_shikigami, not_summon: true}
      effects:
        # 维护者定案(12)：选择目标合法性即要求非召唤物（not_summon 过滤键），可选
        # 敌我任一未气绝式神（any_shikigami 池默认不含气绝者）；旗标值 = 棺材实体
        # 数据 id，任一回合开始清除
        steps:
          - {op: bump_ext, key: coffin_on_defeat, value: 10040299}
      response:
        # 响应：当跳跳哥哥将气绝时自动对其使用（on_before_defeat 即时批次写入旗标，
        # 同次气绝流程末尾消费；响应目标 = 事件 victim）
        when: on_before_defeat
        condition: {victim_shikigami: 100402}
        steps:
          - {op: bump_ext, key: coffin_on_defeat, value: 10040299,
             target: {kind: context, key: victim}}
      text: "使一个非召唤物式神获得‘本回合气绝时，替换为“棺材”’。[响应]：{当跳跳哥哥将气绝时，自动对其使用。}"
