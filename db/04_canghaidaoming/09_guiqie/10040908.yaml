id: 10040908
name: 鬼刃·影杀
versions:
  best: 20200928
  history:
    - date: 20200928  # 发布日期
      card_type: combat
      rarity: R
      level: 3
      keywords: [direct, trigger]  # [直击] + [响应]
      effects:
        # 主动使用 = 普通战斗牌 +2/+1（raw 标注 +2/+1）
        steps:
          - {op: buff_power, amount: 2, target: {kind: self}}
          - {op: gain_shield, amount: 1, target: {kind: self}}
      response:
        # [响应]：当鬼切触发‘狮子之子’时自动使用并复制两次（使用 1 次+复制 2 次
        # = 三次带[直击]的额外攻击——rules.md 第三十七章三）
        when: on_invocation_trigger
        condition: {invocation: 狮子之子, player: self}
        steps:
          - {op: attack_buff, power: 2, target: {kind: self}}
          - {op: gain_shield, amount: 1, target: {kind: self}}
          - {op: launch_attack, keywords: [direct]}
          - {op: launch_attack, keywords: [direct]}
          - {op: launch_attack, keywords: [direct]}
      text: "[直击]。[响应]：{当鬼切触发‘狮子之子’时，自动使用并复制两次。}"
