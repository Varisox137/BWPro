id: 100409
name: 鬼切
versions:
  best: 20200928
  history:
    - date: 20200928  # 发布日期
      faction: 青岚
      power: 2
      health: 4
      abilities:
        # 己方回合开始时，选择一个未结附的鬼斩结附于鬼切上
        # （choose_invocation：剔除已结附同名候选，>1 个挂起 invocation_pick 交互）
        - when: on_turn_start
          condition: {player: self}
          steps:
            - {op: choose_invocation, names: [髭切, 友切, 狮子之子]}
        # 敌方回合结束时，移除所有的鬼斩
        - when: on_turn_end
          condition: {player: opponent}
          steps:
            - {op: detach_invocation, names: [髭切, 友切, 狮子之子]}
      text: "己方回合开始时，选择一个未结附的鬼斩结附于鬼切上。敌方回合结束时，移除所有的鬼斩。"
