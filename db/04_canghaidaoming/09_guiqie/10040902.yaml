name: 鬼影闪
versions:
  best: 20200928
  history:
    - date: 20200928  # 发布日期
      card_type: spell
      rarity: SR
      level: 1
      keywords: [fast]  # [瞬发]
      effects:
        steps:
          # 将鬼切移入战斗区（驻守者按规则退回；尘缚之阵锁定下无效）
          - {op: enter_combat, target: {kind: self}}
          # 选择一个未结附的鬼斩结附于鬼切上
          - {op: choose_invocation, names: [髭切, 友切, 狮子之子]}
          - {op: draw, count: 1}
      text: "[瞬发]。将鬼切移入战斗区，选择一个未结附的鬼斩结附于鬼切上。抽一张牌。"
