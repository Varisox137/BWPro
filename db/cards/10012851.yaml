id: 10012851
version: 20260724
name: 蚀刃毒羽
shikigami: 100128
card_type: combat
rarity: SSR
token: true  # 协战子选项（致命之羽 10012621）
level: 2
cost: 1
effects:
  steps:
    - {op: buff_power, amount: 2, target: {kind: self}}
    - {op: gain_shield, amount: 2, target: {kind: self}}
    # 羁绊：以津真天倒计时-2（战斗牌其它效果步；无倒计时能力修正 -0，未出战空操作）
    - {op: countdown_delta, amount: -2, shikigami: 100126}
temp_grants:
  # 维护者答复(2)：战斗步骤"攻击时"（即时时机，优先级 2 按同批登记顺序）——
  # 若战斗目标此时有破甲，记录该数值并登记一次性"本次战斗结束后赋予等量破甲"
  # （引擎 _battle_echo；无破甲由 victim_has_fragile 条件过滤）
  - when: on_before_assault
    condition: {attacker_shikigami: self, victim_has_fragile: true}
    steps:
      - {op: fragile_echo, target: {kind: context, key: victim}}
text: "若攻击有破甲的角色，则攻击后使其获得相同数量的破甲。[羁绊]：{以津真天倒计时-2}。"
