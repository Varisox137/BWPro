abilities:
  # 觉醒倒计时（initial 2，来源=觉醒牌 id，替换基础倒计时）：2 + x 破甲，
  # x = 基础+觉醒倒计时生效合计（ext["zhen_proc"]，觉醒后继续累加——先给破甲再计数）
  - countdown: 2
    steps:
      - {op: gain_shield, amount: {base: 2, ext: zhen_proc}, kind: fragile,
         target: {kind: all, pool: enemy_player}}
      - {op: bump_ext, key: zhen_proc, target: {kind: self}}
text: 使敌方牌手获得2破甲。[觉醒]：{[倒计时2]：{使敌方牌手获得2破甲。本局游戏你每触发过一次鸩的基础能力，此效果额外+1。（在场上也有效）}}
