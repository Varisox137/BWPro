id: 10012308
version: 20260724
name: 觉醒·妖刀姬
shikigami: 100123
card_type: spell
subtype: awaken
awaken_power: 1   # 永久身材增益："觉醒后"延时时机之后授予（法术觉醒使用事件流程）
awaken_health: 1
rarity: SSR
level: 3
cost: 1
effects:
  steps: []
abilities:
  # 觉醒能力每次进场时（觉醒替换 / 复活），获得一个一次性[迅捷]
  - when: on_awakened
    condition: {target_shikigami: self}
    steps:
      - {op: grant_keyword, keyword: haste, target: {kind: self}}
  - when: on_shikigami_revived
    condition: {shikigami_shikigami: self}
    steps:
      - {op: grant_keyword, keyword: haste, target: {kind: self}}
  - when: on_player_damaged
    condition: {source_shikigami: self}
    steps:
      - {op: card_aura, shikigami: self, card_type: combat, cost_zero: true}
text: "[觉醒]：{[迅捷]。当妖刀姬对敌方牌手造成伤害时，本回合她的所有战斗牌不消耗鬼火。}"
