id: 10012806
name: 致命诱惑
versions:
  best: 20191212
  history:
    - date: 20191212
      card_type: combat
      rarity: R
      level: 2
      effects:
        # grant_keyword step 由战斗牌流程提取为战斗作用域条件授予（战斗终止点移除）；
        # Step.condition 在战斗步骤"确定战斗目标后"以 {"defender": 被攻击者} 求值
        # （全卡盘点(7)：按实际交战另一方判定——甜蜜的负担换人后按其破甲状态）
        steps:
          - {op: buff_power, amount: 2, target: {kind: self}}
          - {op: gain_shield, amount: 2, target: {kind: self}}
          - {op: grant_keyword, keyword: lifesteal, target: {kind: self},
             condition: {defender_has_fragile: true}}
      text: 若攻击有破甲的角色，获得[吸血]。
