id: 10012805
name: 觉醒·鸩
versions:
  best: 20191212
  history:
    - date: 20191212
      card_type: spell
      subtype: awaken
      awaken_power: 1   # 永久身材增益："觉醒后"延时时机之后授予（法术觉醒使用事件流程）
      rarity: SSR
      level: 2
      effects:
        steps: []
      abilities:
        # 觉醒倒计时（initial 2，来源=觉醒牌 id，替换基础倒计时）：2 + x 破甲，
        # x = 基础+觉醒倒计时生效合计（ext["zhen_proc"]，觉醒后继续累加——先给破甲再计数）
        - countdown: 2
          steps:
            - {op: gain_shield, amount: {base: 2, ext: zhen_proc}, kind: fragile,
               target: {kind: all, pool: enemy_player}}
            - {op: bump_ext, key: zhen_proc, target: {kind: self}}
        # 牌面"使鸩的倒计时-2"——挂"觉醒前"（on_before_awaken，能力替换前）；
        # 首次使用时由基础能力的同名块触发（此处覆盖觉醒后再次使用同名牌的情形）
        - when: on_before_awaken
          condition: {player: self, target_shikigami: self}
          steps:
            - {op: countdown_delta, amount: -2, target: {kind: self}}
      text: 使鸩的倒计时-2。[觉醒]：{[倒计时2]：{使敌方牌手获得2破甲。本局游戏你每触发过一次鸩的基础能力，此效果额外+1。（在场上也有效）}}
