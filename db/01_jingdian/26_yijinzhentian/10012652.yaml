            tag: golden_feather
            token: true
            once_key: gilded
            mods: {gilded: true, playable_when_defeated: true, damage_boost: 1,
                   revive_haste: [100126, 100128]}
          # 羁绊：鸩倒计时-2（无倒计时能力修正 -0；未出战为空操作）
          - {op: countdown_delta, amount: -2, shikigami: 100128}
      text: "不消耗鬼火。使手牌所有‘黄金羽’获得‘气绝时可用，伤害+1，使用后以津真天和鸩气绝倒计时-1’。（不可叠加）[羁绊]：{鸩倒计时-2}。"
