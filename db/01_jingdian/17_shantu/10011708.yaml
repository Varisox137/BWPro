      form_power: 6
      form_health: 6
      effects:
        steps:
          # 判定者级"必6"光环：形态进场 on（写牌手 ext dice_force_six）；
          # 离场 off 由引擎随形态离场清理（仿 power_override 形态离场清除通道）
          - {op: set_dice_modifier, mode: six, value: true}
