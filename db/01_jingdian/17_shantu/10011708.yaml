          - {op: buff_power, amount: 0, amount_ext: dice_six_count, target: {kind: self}}
          - {op: buff_health, amount: 0, amount_ext: dice_six_count, target: {kind: self}}
      text: "你投骰子总是会投出6点。[增强]：{本局游戏你骰子每投出一次6点，此牌便获得+1力量与+1生命。}"
