id: 10011704
name: 觉醒·山兔
versions:
  best: 20191212
  history:
    - date: 20191212
      card_type: spell
      subtype: awaken
      awaken_power: 1   # 永久身材增益："觉醒后"延时时机之后授予（法术觉醒使用事件流程）
      awaken_health: 1
      rarity: SR
      level: 2
      effects:
        steps: []
      abilities:
        # 两个独立 block = 两次独立 [运势6] 判定（规则要点）
        - when: on_turn_start
          condition: {player: self}
          luck: 6
          steps:
            - {op: countdown_power_boost, countdown: -1, power: 2,
               target: {kind: all, pool: friendly_others}}
            # 气绝者只减复活倒计时、不追加力量（同基础能力，拆 friendly_defeated 步）
            - {op: countdown_power_boost, countdown: -1, power: 0,
               target: {kind: all, pool: friendly_defeated}}
        - when: on_turn_start
          condition: {player: self}
          luck: 6
          steps:
            - {op: countdown_power_boost, countdown: -1, power: 2,
               target: {kind: all, pool: friendly_others}}
            # 气绝者只减复活倒计时、不追加力量（同基础能力，拆 friendly_defeated 步）
            - {op: countdown_power_boost, countdown: -1, power: 0,
               target: {kind: all, pool: friendly_defeated}}
      text: "[觉醒]：{己方回合开始时，[运势6]：{其他己方式神的[倒计时]-1并获得2力量}，然后重复一次。}"
