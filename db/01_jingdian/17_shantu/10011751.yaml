              - {op: power_override, "on": true, scope: turn,
                 target: {kind: all, pool: enemy_shikigami}}
      text: "[瞬发]。[增强]：{本局游戏你骰子投出三次6点，敌方下回合所有卡牌鬼火消耗+1}。[羁绊]：{座敷童子[运势4]：{直到敌方回合结束，所有敌方式神力量变为0}。}"
