id: 10011006
name: 夺命
versions:
  best: 20191212
  history:
    - date: 20191212
      card_type: combat
      rarity: SSR
      level: 2
      keywords: [lethal]
      effects:
        steps: []
      temp_grants:
        # 变后效果：消灭受到判官战斗伤害的角色——式神走 on_damage 的 victim、
        # 牌手走 on_player_damaged 的 damaged_player；门控改读击杀账本
        # （kill_count_ge: 13 = "你消灭过13个式神"，engine.check_defeated 记账）
        - when: on_damage
          condition: {source_shikigami: self, kind: combat, kill_count_ge: 13}
          steps:
            - {op: destroy, target: {kind: context, key: victim}}
        - when: on_player_damaged
          condition: {source_shikigami: self, kind: combat, kill_count_ge: 13}
          steps:
            - {op: destroy, target: {kind: context, key: damaged_player}}
      text: "[必杀]。[增强]：{本局游戏若你消灭过13个式神，改为‘消灭受到判官战斗伤害的角色’。}"
