id: 10011003
name: 生死无常
versions:
  best: 20191212
  history:
    - date: 20191212
      card_type: spell
      rarity: R
      level: 2
      keywords: [trigger]
      effects:
        # 消灭己方战斗区的式神，然后消灭敌方战斗区的式神
        steps:
          - {op: destroy, target: {kind: all, pool: friendly_combat}}
          - {op: destroy, target: {kind: all, pool: enemy_combat}}
      response:
        # [响应]：当己方战斗区式神被攻击时，自动使用；裁决(7)：使用后、执行前
        # 再检查己方战斗区是否有式神（可与被攻击者不同——exec_condition）
        when: on_before_assault
        condition: {victim_side: friendly, victim_kind: shikigami, victim_in_combat: true}
        exec_condition: {combat_occupied: friendly}
        steps:
          - {op: destroy, target: {kind: all, pool: friendly_combat}}
          - {op: destroy, target: {kind: all, pool: enemy_combat}}
      text: "消灭己方战斗区的式神，然后消灭敌方战斗区的式神。[响应]：{当己方战斗区式神被攻击时，自动使用此牌。}"
