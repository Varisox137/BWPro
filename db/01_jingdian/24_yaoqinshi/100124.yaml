  history:
    - date: 20251212
      faction: 苍叶
      power: 3
      health: 4
      ability:
        # 静态倒计时能力块（对局开始/升至1级/复活时注册）：[倒计时3] 己方所有角色恢复3生命
        countdown: 3
        steps:
          - {op: heal, amount: 3, target: {kind: all, pool: friendly_shikigami}}
          - {op: heal, amount: 3, target: {kind: all, pool: self_player}}
      abilities:
        # 使用妖琴师的觉醒法术牌时：妖琴师倒计时-3——挂"觉醒前"（on_before_awaken，能力替换前），
        # 对被替换掉的（旧）能力倒计时 -3，归零则先结算旧倒计时效果，再完成觉醒替换
        # （第十阶段维护者答复；旧语义为 on_card_played 替换后对新倒计时 -3，已推翻）
        - when: on_before_awaken
          condition: {player: self, target_shikigami: self}
          steps:
            - {op: countdown_delta, amount: -3, target: {kind: self}}
      text: "[倒计时3]：{为己方所有角色恢复3生命}。当你使用妖琴师的[觉醒]法术牌时，使妖琴师的倒计时-3。"
