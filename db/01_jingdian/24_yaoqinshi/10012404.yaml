id: 10012404
name: 魔音扰心
versions:
  best: 20191212
  history:
    - date: 20191212
      card_type: spell
      rarity: SR
      level: 2
      keywords: [trigger]
      effects:
        # 主动使用：登记一次性延迟能力"下一次敌方用牌的使用前无效化"（[唯一]——
        # unique: true，全卡盘点(19)：重复登记替换旧条目不叠加；本回合，己方回合
        # 开始未消耗则清除）；无效化 = 跳过效果块、牌照常离手进墓地（费用已付不退）。
        # already_nullified: false：该次使用若已被响应（"使用手牌前"时机，早一个
        # 时机）无效化，本延迟能力不再触发消耗
        steps:
          - op: delay_grant
            when: on_before_card_play
            condition: {player: opponent, already_nullified: false}
            scope: turn
            unique: true
            steps:
              - {op: nullify_card_play}
      response:
        # 响应（覆盖块，主动/响应结构不同；全卡盘点(19) 定案）：挂"使用手牌前"
        # （on_before_hand_play——比衍生能力的"使用前"早一个时机，仅手牌来源的
        # 使用触发；凭空自动使用不触发响应）——敌方用牌的使用手牌前直接无效化
        when: on_before_hand_play
        condition: {player: opponent}
        steps:
          - {op: nullify_card_play}
      text: "敌方牌手本回合使用的下一张牌不会生效。[响应]：{当敌方牌手将使用牌时，自动使用此牌。}"
