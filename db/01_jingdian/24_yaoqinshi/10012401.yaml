id: 10012401
name: 觉醒·入阵歌
versions:
  best: 20251212
  history:
    - date: 20251212
      card_type: spell
      subtype: awaken
      awaken_health: 1   # 永久身材增益："觉醒后"延时时机之后授予（法术觉醒使用事件流程）
      rarity: R
      level: 1
      effects:
        steps: []
      abilities:
        # 觉醒倒计时（initial 3，来源=觉醒牌 id，替换基础倒计时）：5 伤随机分配给所有敌方角色
        - countdown: 3
          steps:
            - {op: distribute_damage, amount: 5, pool: enemy_character}
        # 使用妖琴师的觉醒法术牌时：倒计时-3——挂"觉醒前"（on_before_awaken，能力替换前），
        # 对被替换掉的（旧）能力倒计时 -3，归零则先结算旧倒计时效果，再完成觉醒替换
        - when: on_before_awaken
          condition: {player: self, target_shikigami: self}
          steps:
            - {op: countdown_delta, amount: -3, target: {kind: self}}
      text: "[觉醒]：{[倒计时3]：{造成5点伤害，随机分配给所有敌方角色}。当你使用妖琴师的[觉醒]法术牌时，使妖琴师的倒计时-3。}"
