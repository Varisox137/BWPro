id: 10012401
version: 20260724
name: 觉醒·入阵歌
shikigami: 100124
card_type: spell
subtype: awaken
awaken_health: 1   # 永久身材增益："觉醒后"延时时机之后授予（法术觉醒使用事件流程）
rarity: R
level: 1
cost: 1
effects:
  steps: []
abilities:
  # 觉醒倒计时（initial 3，来源=觉醒牌 id，替换基础倒计时）：5 伤随机分配给所有敌方角色
  - countdown: 3
    steps:
      - {op: distribute_damage, amount: 5, pool: enemy_character}
  # 使用妖琴师的觉醒法术牌时：倒计时-3（含本张——同次出牌先注册新倒计时再 -3 至 0 立即归零）
  - when: on_card_played
    condition: {player: self, card_type: spell, subtype: awaken, shikigami: 100124}
    steps:
      - {op: countdown_delta, amount: -3, target: {kind: self}}
text: "[觉醒]：{[倒计时3]：{造成5点伤害，随机分配给所有敌方角色}。当你使用妖琴师的[觉醒]法术牌时，使妖琴师的倒计时-3。}"
