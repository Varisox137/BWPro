id: 10012405
name: 疯魔琴心
versions:
  best: 20191212
  history:
    - date: 20191212
      card_type: spell
      rarity: SR
      level: 2
      effects:
        # 重置所有敌方角色的倒计时：复原为 countdown_initial，不触发归零流程；
        # 无倒计时能力者空操作（countdown_delta reset=True，20191212 公测版效果）
        steps:
          - {op: countdown_delta, reset: true, target: {kind: all, pool: enemy_shikigami}}
      text: 重置所有敌方角色的倒计时。
    - date: 20200227
      card_type: spell
      rarity: SR
      level: 2
      target: {kind: choose, pool: enemy_shikigami}
      effects:
        # 使一个敌方式神的倒计时+2（无倒计时能力者空操作），再使妖琴师倒计时-2
        # （可归零触发基础能力；positive delta 直接累加无上限）
        steps:
          - {op: countdown_delta, amount: 2}
          - {op: countdown_delta, amount: -2, target: {kind: self}}
      text: "使一个敌方式神的[倒计时]+2，使妖琴师的[倒计时]-2。"
