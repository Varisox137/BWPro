id: 10012708
name: 觉醒·萤草
versions:
  best: 20191212
  history:
    - date: 20191212
      card_type: spell
      subtype: awaken
      awaken_power: 2   # 永久身材增益："觉醒后"延时时机之后授予
      awaken_health: 2
      rarity: SR
      level: 3
      effects:
        steps: []
      abilities:
        # [觉醒]：己方式神的形态牌获得[瞬发]（能力进场登记通配光环——shikigami=any
        # 命中任意所属式神的牌；scope=ability 随能力离场移除/进场重注册）
        - when: on_ability_enter
          condition: {target_shikigami: self}
          steps:
            - {op: card_aura, shikigami: any, card_type: form, keywords: [fast],
               scope: ability}
        # [觉醒]：己方式神使用形态牌时抽一张牌
        - when: on_card_played
          condition: {player: self, card_type: form}
          steps:
            - {op: draw, count: 1}
      text: "[觉醒]：{己方式神的形态牌获得[瞬发]且使用时抽一张牌。}"
