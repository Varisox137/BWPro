id: 100127
name: 萤草
versions:
  best: 20191212
  history:
    - date: 20191212
      faction: 苍叶
      power: 2
      health: 5
      abilities:
        # 能力进场时（对局开始/升至 1 级/复活/觉醒后再次进场）登记绑定本能力的
        # 卡牌光环：萤草的形态牌获得[瞬发]（scope=ability——气绝/变形/觉醒替换
        # 时随能力离场移除，能力进场重新注册）
        - when: on_ability_enter
          condition: {target_shikigami: self}
          steps:
            - {op: card_aura, shikigami: self, card_type: form, keywords: [fast],
               scope: ability}
        # 萤草使用形态牌时抽一张牌（on_card_played payload shikigami=牌所属式神数据 id）
        - when: on_card_played
          condition: {player: self, card_type: form, shikigami: 100127}
          steps:
            - {op: draw, count: 1}
      text: 萤草的形态牌获得[瞬发]且使用时抽一张牌。
