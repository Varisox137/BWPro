id: 10010605
name: 偷袭
versions:
  best: 20191212
  history:
    - date: 20191212
      card_type: combat
      rarity: R
      level: 2
      keywords: [trigger]
      effects:
        # [响应]：{当敌方战斗区式神气绝时，自动使用此牌}；无当前战斗的响应
        # 战斗牌按完整战斗流程发起新战斗（响应收集仅非活动方，与其他响应牌一致）
        when: on_shikigami_defeated
        condition: {victim_side: enemy, in_combat: true, summon: false}
        steps:
          - {op: buff_power, amount: 3, target: {kind: self}}
      text: "[响应]：{当敌方战斗区式神气绝时，自动使用此牌。}"
    - date: 20200423
      card_type: combat
      rarity: R
      level: 2
      keywords: [trigger]
      effects:
        # [响应]：{当敌方回合结束时战斗区没有式神，自动使用此牌}（combat_empty: enemy
        # 检查对方战斗区为空）；无当前战斗的响应，战斗牌按完整战斗流程发起新战斗
        # （响应收集仅非活动方，与其他响应牌一致）
        when: on_turn_end
        condition: {player: opponent, combat_empty: enemy}
        steps:
          - {op: buff_power, amount: 3, target: {kind: self}}
      triggers:
        # 在敌方回合获得[瞬发]：敌方回合开始登记本回合光环（card_id 限定本牌；
        # 伺机 10011607 同型，turn=opponent 限定敌方回合窗口）
        - when: on_turn_start
          condition: {player: opponent}
          steps:
            - {op: card_aura, shikigami: 100106, card_id: 10010605, keywords: [fast],
               turn: opponent, scope: turn}
      text: "在敌方回合获得[瞬发]。[响应]：{当敌方回合结束时战斗区没有式神，自动使用此牌。}"
