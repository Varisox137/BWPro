          condition: {source_shikigami: self, victim_side: enemy, victim_kind: shikigami}
          steps:
            - {op: launch_attack, shikigami: self}
      text: "当其他己方式神攻击后，本回合此牌获得[瞬发]。[觉醒]：{[远程]。姑获鸟击杀敌方式神时，再发起一次攻击。}"
