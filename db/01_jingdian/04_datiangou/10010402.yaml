          # 未实际造成伤害（被护甲吸收等）不移回
          - op: damage
            amount: 2
            target: {kind: all, pool: projectile}
            insert:
              condition: {victim_kind: shikigami}
              steps:
                - {op: retreat, target: {kind: context, key: victim}}
      text: "[投射]：{造成2点伤害，然后将受到此伤害的式神移回准备区}。"
