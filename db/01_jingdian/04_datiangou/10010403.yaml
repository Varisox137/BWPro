id: 10010403
name: 暴风之盾
versions:
  best: 20251212
  history:
    - date: 20251212
      card_type: spell
      rarity: R
      level: 1
      keywords: [trigger]
      target: {kind: choose, pool: friendly_shikigami}
      effects:
        # 响应"当你战斗区式神被攻击时"：出击的受击方即战斗区式神（或牌手），
        # victim_side+victim_kind 即等价；响应结算自动选择事件中的被攻击者
        when: on_before_assault
        condition: {victim_side: friendly, victim_kind: shikigami}
        steps:
          - {op: gain_shield, amount: 2}
          - op: delay_grant
            when: on_turn_start
            condition: {player: self}
            steps:
              # 无 target：以打出时的选择目标（随延迟能力存储）为对象
              - {op: gain_shield, amount: 2}
      text: 使一个己方式神获得2护甲并在下个回合开始时再获得2护甲。[响应]：{当你战斗区式神被攻击时，自动对其使用。}
