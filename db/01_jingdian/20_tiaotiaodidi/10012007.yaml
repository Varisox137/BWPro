          condition: {victim_shikigami: self, amount_ge: 6}
          steps:
            - {op: gain_shield, amount: 3, kind: fragile,
               target: {kind: all, pool: enemy_shikigami}}
        - when: on_damage
          condition: {victim_shikigami: self, amount_ge: 15}
          steps:
            - {op: gain_shield, amount: 10, kind: fragile,
               target: {kind: all, pool: enemy_player}}
