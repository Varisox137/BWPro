id: 10011606
name: 觉醒·山童
versions:
  best: 20251212
  history:
    - date: 20251212
      card_type: spell
      subtype: awaken
      awaken_power: 1   # 永久身材增益："觉醒后"延时时机之后授予（法术觉醒使用事件流程）
      awaken_health: 1
      rarity: SSR
      level: 2
      effects:
        steps: []
      abilities:
        # [觉醒]：{[贯通]（山童基础能力已为永久贯通，觉醒授予为牌面语义的显式落地）
        #  + 免疫敌方非战斗伤害（scope=perm 持续在场期间有效，气绝清除、复活重新授予）}
        - when: on_awakened
          condition: {target_shikigami: self}
          steps:
            - {op: grant_keyword, keyword: piercing, target: {kind: self}}
            - {op: grant_immunity, scope: perm, kind: effect, from_side: enemy,
               target: {kind: self}}
        - when: on_shikigami_revived
          condition: {shikigami_shikigami: self}
          steps:
            - {op: grant_immunity, scope: perm, kind: effect, from_side: enemy,
               target: {kind: self}}
      text: "[觉醒]：{[贯通]。免疫敌方非战斗伤害。}"
