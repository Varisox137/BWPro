id: 10011508
name: 觉醒·犬神
versions:
  best: 20191212
  history:
    - date: 20191212
      card_type: spell
      subtype: awaken
      awaken_power: 0   # +0/+0
      awaken_health: 0
      rarity: SSR
      level: 3
      effects:
        steps: []
      abilities:
        # [觉醒]：{己方回合结束时，复活犬神并永久获得1力量和1生命}——仅气绝时触发
        # （trigger_when_defeated 放行收集 + holder_defeated 限定；存活时不触发不增益）
        - when: on_turn_end
          condition: {player: self, holder_defeated: true}
          trigger_when_defeated: true
          steps:
            - {op: revive, target: {kind: self}}
            - {op: buff_power, amount: 1, perm: true, target: {kind: self}}
            - {op: buff_health, amount: 1, perm: true, target: {kind: self}}
      text: "[觉醒]：{己方回合结束时，复活犬神并永久获得1力量和1生命。}"
