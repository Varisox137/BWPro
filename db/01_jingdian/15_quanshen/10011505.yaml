id: 10011505
name: 守护
versions:
  best: 20191212
  history:
    - date: 20191212
      card_type: combat
      rarity: SR
      level: 2
      keywords: [trigger]
      effects:
        # 响应"当你其他式神被攻击时"（先例 伺机 10011607）：+0/+4 经战斗牌数值通道；
        # 响应插入使用把犬神移入防守方战斗区。引擎仅对无目标战斗在（被）攻击时结算后
        # 重读被攻击者——追猎类有选定目标的战斗可响应（付火/+0/+4/移入战斗区照常）但
        # 目标不转移（维护者定案第十三阶段）；直击打牌手前提不成立
        when: on_before_assault
        condition: {victim_side: friendly, victim_kind: shikigami,
                    victim_not_shikigami: 100115, attacker_side: enemy}
        steps:
          - {op: gain_shield, amount: 4, target: {kind: self}}
      text: "[响应]：{当你其他式神被攻击时，自动使用此牌。}"
