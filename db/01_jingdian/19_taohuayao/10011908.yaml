          condition: {source_shikigami: self, shikigami_side: friendly}
          steps:
            - {op: buff_power, amount: 2, perm: true, target: {kind: context, key: shikigami}}
            - {op: buff_health, amount: 2, perm: true, target: {kind: context, key: shikigami}}
      text: "为一个角色恢复5生命。[觉醒]：{桃花妖治疗或复活己方式神时，使该式神永久获得2力量及2生命。}"
