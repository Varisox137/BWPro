id: 100107
version: 20260730
name: 海坊主
faction: 青岚
power: 2
health: 6
ability:
  # 过量治疗转化：on_heal 仅在实际恢复 > 0 时发出（满血治疗不触发，维护者答复 0）；
  # overheal = 治疗量 - 实际治疗量（payload 字段，engine.heal 计算）
  when: on_heal
  condition: {source_shikigami: self, target_side: friendly, overheal_ge: 1}
  steps:
    - {op: gain_shield, amount: {event: overheal}, target: {kind: context, key: target}}
text: 海坊主对己方造成的过量治疗会转化为护甲。
