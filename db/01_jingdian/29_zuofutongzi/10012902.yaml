      x: 4
      judge: both
      then:
        - {op: heal, amount: 3, target: {kind: all, pool: self_player}}
abilities:
  # 己方回合开始时：同上
  - when: on_turn_start
    condition: {player: self}
    steps:
      - op: luck_roll
        x: 4
        judge: both
        then:
          - {op: heal, amount: 3, target: {kind: all, pool: self_player}}
text: "进场和己方回合开始时，双方牌手[运势4]：{恢复3生命。}"
