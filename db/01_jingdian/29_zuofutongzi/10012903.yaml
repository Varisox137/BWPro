id: 10012903
name: 福寿双全
versions:
  best: 20191212
  history:
    - date: 20191212
      card_type: form
      rarity: SR
      level: 1
      form_power: 4
      form_health: 5
      conditional_keywords:
        # "结附形态牌时"=现有 has_form 条件语义（在座即视为已结附），文本按 raw 规范化
        - {keyword: fast, shikigami_has_form: 100129}
      effects:
        steps:
          # 增强同条件：使用时抽一张牌
          - {op: draw, count: 1, condition: {shikigami_has_form: 100129}}
          # 进场时双方各获得1点鬼火（gain_orb side 参数为契约外扩展，需引擎侧支持）
          - {op: gain_orb, amount: 1, side: self}
          - {op: gain_orb, amount: 1, side: opponent}
      abilities:
        # 离场时双方各+1鬼火——仅形态被替换离场触发（reason=replace 已有挂点，
        # _attach_form 旧形态以 "replace" 消灭；气绝导致消灭不触发，规则要点）
        - when: on_form_destroyed
          condition: {target_shikigami: self, reason: replace}
          steps:
            - {op: gain_orb, amount: 1, side: self}
            - {op: gain_orb, amount: 1, side: opponent}
      text: "[增强]：{座敷童子结附形态牌时，此牌获得[瞬发]且使用时抽一张牌}。此牌进场或离场时，双方各获得1点鬼火。"
