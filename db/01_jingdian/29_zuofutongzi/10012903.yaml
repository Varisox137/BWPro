id: 10012903
name: 福寿双全
versions:
  best: 20191212
  history:
    - date: 20191212
      card_type: form
      rarity: SR
      level: 1
      form_power: 4
      form_health: 5
      conditional_keywords:
        # "结附形态牌时"=使用时检查（在座即视为已结附；打出前判定——形态先结附后
        # 结算，conditional_keywords 费用时点读取），文本按 raw 规范化
        - {keyword: fast, shikigami_has_form: 100129}
      effects:
        steps:
          # 增强同条件：使用时抽一张牌——按打出前快照（pre_play_form，全卡盘点(11)：
          # 只在使用时检查是否具有形态；执行时（本形态已结附）无形态也照抽）
          - {op: draw, count: 1, condition: {pre_play_form: true}}
      abilities:
        # 进场/离场时双方各+1鬼火——触发条件类似觉醒·一目连（全卡盘点(11)：
        # 任意原因消灭均含；on_form_attached/on_form_destroyed 均延时时机，
        # 离场形态自身能力在状态变更前仍可收集；card_id 限定本牌）
        - when: on_form_attached
          condition: {target_shikigami: self, card_id: 10012903}
          steps:
            - {op: gain_orb, amount: 1, side: self}
            - {op: gain_orb, amount: 1, side: opponent}
        - when: on_form_destroyed
          condition: {target_shikigami: self, card_id: 10012903}
          steps:
            - {op: gain_orb, amount: 1, side: self}
            - {op: gain_orb, amount: 1, side: opponent}
      text: "[增强]：{座敷童子结附形态牌时，此牌获得[瞬发]且使用时抽一张牌}。此牌进场或离场时，双方各获得1点鬼火。"
