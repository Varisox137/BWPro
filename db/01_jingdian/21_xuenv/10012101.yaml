id: 10012101
name: 寒冰之盾
versions:
  best: 20251212
  history:
    - date: 20251212
      card_type: spell
      rarity: R
      level: 1
      keywords: [trigger]
      target: {kind: choose, pool: friendly_shikigami}
      effects:
        steps:
          - {op: gain_shield, amount: 2}
          # 本回合获得"眩晕受到其战斗伤害的式神"：延迟能力绑定被选式神（bind=chosen，
          # 沧海之盾 10010703 先例），scope=turn + uses=99 本回合不限次（青蛇 10011403
          # 同例；己方回合开始清除）
          - {op: delay_grant, bind: chosen, scope: turn, uses: 99, when: on_damage,
             condition: {source_shikigami: self, kind: combat, victim_kind: shikigami},
             steps: [{op: stun, target: {kind: context, key: victim}}]}
      response:
        # 响应：当你战斗区式神被攻击时，自动对其使用（choose 目标自动取事件 victim）
        when: on_before_assault
        condition: {victim_side: friendly, victim_kind: shikigami, victim_in_combat: true}
        steps:
          - {op: gain_shield, amount: 2}
          - {op: delay_grant, bind: chosen, scope: turn, uses: 99, when: on_damage,
             condition: {source_shikigami: self, kind: combat, victim_kind: shikigami},
             steps: [{op: stun, target: {kind: context, key: victim}}]}
      text: "使一个己方式神获得2护甲且本回合获得‘[眩晕]受到其战斗伤害的式神’。[响应]：{当你战斗区式神被攻击时，自动对其使用。}"
