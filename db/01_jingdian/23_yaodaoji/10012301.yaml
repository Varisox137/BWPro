id: 10012301
name: 不祥之刃
versions:
  best: 20191212
  history:
    - date: 20191212
      card_type: combat
      rarity: R
      level: 1
      effects:
        steps:
          - {op: gain_shield, amount: 1, target: {kind: self}}
      temp_grants:
        # 对敌方牌手造成战斗伤害时抽一张牌（全卡盘点(14) 定案：限战斗伤害，
        # 取代旧定案(4) 的不限类别口径）；source_shikigami 限定妖刀姬为来源
        - when: on_player_damaged
          condition: {source_shikigami: self, kind: combat}
          steps:
            - {op: draw, count: 1, target: {kind: all, pool: self_player}}
      text: 对敌方牌手造成伤害时，抽一张牌。
    - date: 20201224  # 平衡性调整：触发改为击杀敌方式神
      card_type: combat
      rarity: R
      level: 1
      effects:
        steps:
          - {op: gain_shield, amount: 1, target: {kind: self}}
      temp_grants:
        # 消灭敌方式神时抽一张牌：source_shikigami 限定妖刀姬为击杀来源
        # （释煞阵先例），victim_side 限定敌方
        - when: on_shikigami_defeated
          condition: {source_shikigami: self, victim_side: enemy}
          steps:
            - {op: draw, count: 1, target: {kind: all, pool: self_player}}
      text: "消灭敌方式神时，抽一张牌。"
