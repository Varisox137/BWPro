id: 10030503
name: 觉醒·彼岸花
versions:
  best: 20200624
  history:
    - date: 20200624  # 发布日期
      card_type: spell
      subtype: awaken
      awaken_power: 1   # +1/+0
      awaken_health: 0
      rarity: SR
      level: 1
      effects:
        steps:
          # 对双方牌手各造成3点伤害（对自身牌手的伤害来源=彼岸花→己方伤害，
          # 触发觉醒能力的投射）
          - {op: damage, amount: 3, target: {kind: all, pool: any_player}}
      abilities:
        # [觉醒]：每当你受到己方伤害时，[投射]：造成1点伤害（牌手受伤事件为
        # on_player_damaged）
        - when: on_player_damaged
          condition: {player: self, source_side: friendly}
          steps:
            - {op: damage, amount: 1, target: {kind: all, pool: projectile}}
      text: "对双方牌手各造成3点伤害。[觉醒]：{每当你受到己方伤害时，[投射]：{造成1点伤害}。}"
