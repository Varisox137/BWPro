id: 100303
name: 辉夜姬
versions:
  best: 20200624
  history:
    - date: 20200624
      faction: 青岚
      power: 1
      health: 5
      abilities:
        # 「辉夜姬的幻境同时只能存在一个但耐久会叠加」（定案(6)）：能力进场时、以及
        # 能力在场时的"召唤幻境后"延时时机——队列中存在多个她的幻境时合并：保留队列
        # 最后一个、耐久设置为所有她的幻境的耐久总和、消灭其余（field_merge 动作，
        # 未觉醒不合并能力块）
        - when: on_summon_field
          condition: {player: self}
          steps:
            - {op: field_merge}
        - when: on_ability_enter
          condition: {target_shikigami: self}
          steps:
            - {op: field_merge}
      text: "辉夜姬的幻境同时只能存在一个但耐久会叠加。"
