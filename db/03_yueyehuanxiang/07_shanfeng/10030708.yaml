id: 10030708
name: 觉醒·山风
versions:
  best: 20200624
  history:
    - date: 20200624  # 发布日期
      card_type: spell
      subtype: awaken
      awaken_power: 1
      awaken_health: 1
      rarity: SSR
      level: 3
      effects:
        # 觉醒替换基础能力（+1/+1 由 awaken_power/awaken_health 字段自动结算）
        steps: []
      abilities:
        # 觉醒能力①：[倒计时3] 发起一次攻击，本次战斗免疫战斗伤害——grant_immunity
        # scope=next_battle（倒计时块内无战斗上下文，战斗外挂账、下一次作为攻击者
        # 发起的战斗开始消费；定案(8)：全程免疫其战斗伤害）
        - countdown: 3
          steps:
            - {op: grant_immunity, kind: combat_damage, scope: next_battle, target: {kind: self}}
            - {op: launch_attack, shikigami: self}
        # 觉醒能力②：**任何己方的减少倒计时效果**（含在场能力，2026-08 定案——raw
        # 文本"你的牌"的语义扩展，见 card-status.md 山风节）对山风以外的未气绝己方
        # 式神生效时，对山风造成等量效果（无倒计时能力者也算"生效"——countdown_delta
        # 对其发 actual=0 事件；山风气绝时有效，减其气绝倒计时）。natural_not 排除
        # 回合开始批次的自然减少（规则性减少非"效果"——维持原"自然减少不共享"口径）。
        # timing=queue：复制是 on_countdown_reduced 即时默认的特例（定案"倒计时减少
        # 触发效果都是即时时机，觉醒山风的复制倒计时减少是特例（延时执行）"），延时界=
        # 引起该次减少的结算单元（engine horizon 机制）
        - when: on_countdown_reduced
          timing: queue
          trigger_when_defeated: true
          condition: {natural_not: true, shikigami_side: friendly, shikigami_not_shikigami: 100307}
          steps:
            - {op: countdown_delta, amount: {event: original, negate: true},
               target: {kind: self}}
            - {op: countdown_delta, amount: {event: original, negate: true},
               revive: true, target: {kind: self}, condition: {holder_defeated: true}}
      text: "[觉醒]：{[倒计时3]：{发起一次攻击，本次战斗免疫战斗伤害}。你的牌对山风以外的未气绝己方式神造成的减少倒计时效果对山风造成等量效果。（山风气绝时有效）}"
