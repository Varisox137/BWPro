id: 10030951
name: 妖怪屋·灵力
versions:
  best: 20200624
  history:
    - date: 20200624  # 发布日期
      card_type: spell
      rarity: R
      token: true
      level: 1
      target: {kind: choose, pool: friendly_shikigami}
      effects:
        # 使一个己方式神获得1点护甲（基础方式）；[增强] 见 triggers 卡牌触发器
        steps:
          - {op: gain_shield, amount: 1}
      methods:
        # 多择另一用法：使一个敌方式神获得1点破甲（方式 target/effects 整体覆盖）
        - id: fragile
          target: {kind: choose, pool: enemy_shikigami}
          effects:
            steps:
              - {op: gain_shield, amount: 1, kind: fragile}
      triggers:
        # [增强] 每当己方角色的护甲或敌方角色的破甲因回合开始移除时，此牌效果+1：
        # on_shield_changed reason=turn_start_clear 且 gained=false 两情形（己方护甲
        # 减少 / 敌方破甲减少），card_in_hand 门控仅手牌中触发；add_mod shield_boost
        # 累加（gain_shield 结算读取实例增强）
        - when: on_shield_changed
          condition: {reason: turn_start_clear, gained: false, card_in_hand: true,
                      kind: shield, target_side: friendly}
          steps:
            - {op: add_mod, to: hand, key: shield_boost, amount: 1}
        - when: on_shield_changed
          condition: {reason: turn_start_clear, gained: false, card_in_hand: true,
                      kind: fragile, target_side: enemy}
          steps:
            - {op: add_mod, to: hand, key: shield_boost, amount: 1}
      text: "使一个己方式神获得1点护甲或使一个敌方式神获得1点破甲。[增强]：{每当己方角色的护甲或敌方角色的破甲因回合开始移除时，此牌效果+1。}"
