id: 10030208
name: 永劫轮回
versions:
  best: 20200624
  history:
    - date: 20200624  # 发布日期
      card_type: form
      rarity: SR
      level: 3
      form_power: 3
      form_health: 7
      effects:
        steps:
          # 进场时召唤泷夜叉姬的两个幻境（新月之哀+日轮之城——pick=all 召唤她全部
          # 非 token 幻境牌各一）
          - {op: summon_field, shikigami: self, pick: all}
      abilities:
        # 「泷夜叉姬的所有幻境改为对己方所有式神有效」：己方其他式神（非泷夜叉姬
        # 本人——她的伤害由新月之哀/日轮之城自身能力块处理）受到伤害时，由首个
        # 泷夜叉姬幻境代为承受（改降量 = min(伤害余量, 当前耐久)）
        - when: on_after_shield
          condition: {victim_side: friendly, victim_kind: shikigami,
                      victim_not_shikigami: 100302}
          steps:
            - {op: redirect_to_field, field_shikigami: self}
      text: "进场时召唤泷夜叉姬的两个幻境。泷夜叉姬的所有幻境改为对己方所有式神有效。"
