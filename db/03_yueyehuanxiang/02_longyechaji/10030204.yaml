          # choose 通道待 pending_choice 落地后补——见 questions.md）
          - {op: summon_field, shikigami: self, pick: random}
      temp_grants:
        # 当对牌手造成伤害时（不限战斗类别），使泷夜叉姬的所有幻境获得3耐久（牌手
        # 受伤事件为 on_player_damaged，player=受伤牌手下标——限定敌方）；uses 放开
        # 使[连击]第二段同样触发（同胧月雪华斩先例）
        - when: on_player_damaged
          uses: 99
          condition: {source_shikigami: self, player: opponent}
          steps:
            - {op: field_op, side: self, pick: all, amount: 3}
      text: "选择召唤一个泷夜叉姬的幻境。当对牌手造成伤害时，使泷夜叉姬的所有幻境获得3耐久。"
