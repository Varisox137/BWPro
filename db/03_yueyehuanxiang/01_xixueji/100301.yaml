id: 100301
name: 吸血姬
versions:
  best: 20200624
  history:
    - date: 20200624  # 发布日期
      faction: 红莲
      power: 3
      health: 4
      ability:
        # 每当你恢复生命时：挂 on_after_heal（治疗后延时时机，0 治疗不触发——答复(1)
        # 定案）；payload 的 target 为 Ref——target_side（归属）+ target_kind（式神/牌手）
        # 组合判"治疗目标是己方牌手"；力量为一次性赋予的持续性增益（perm: false——
        # 非永久、跨回合保留、气绝清除，维护者 thoughts(4) 定案）
        when: on_after_heal
        condition: {target_side: friendly, target_kind: player}
        steps:
          - {op: buff_power, amount: 1, perm: false, target: {kind: self}}
          - {op: gain_shield, amount: 1, target: {kind: self}}
      text: "每当你恢复生命时，吸血姬获得1力量与1护甲。"
    - date: 20200820
      faction: 红莲
      power: 3
      health: 4
      ability:
        # 20200820：追加"每回合一次"（turn_mark/turn_mark_not 门控，雪女 snowball 先例）
        when: on_after_heal
        condition: {target_side: friendly, target_kind: player, turn_mark_not: heal_buff}
        steps:
          - {op: turn_mark, key: heal_buff}
          - {op: buff_power, amount: 1, perm: false, target: {kind: self}}
          - {op: gain_shield, amount: 1, target: {kind: self}}
      text: "每回合一次，当你恢复生命时，吸血姬获得1力量与1护甲。"
