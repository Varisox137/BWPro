id: 10020703
name: 光影
versions:
  best: 20200520
  history:
    - date: 20200520  # 发布日期
      card_type: combat
      rarity: R
      level: 1
      effects:
        # +1/+1（战斗牌数值通道：战力/护甲提取）
        steps:
          - {op: buff_power, amount: 1, target: {kind: self}}
          - {op: gain_shield, amount: 1, target: {kind: self}}
      temp_grants:
        # 造成战斗伤害时，若该次伤害>=6：你抽一张牌并获得等同于一半伤害的生命
        # （定案：按单个伤害事件判定——贯通对式神+牌手两段各<6不触发；连击两段
        # 各>=6各触发一次；on_damage 式神受害者 / on_player_damaged 牌手受害者
        # 双块；{event: amount, half: true} 数值键=事件引用值减半向下取整）
        - when: on_damage
          condition: {kind: combat, source_shikigami: self, amount_ge: 6}
          steps:
            - {op: draw, count: 1}
            - {op: heal, amount: {event: amount, half: true},
               target: {kind: all, pool: self_player}}
        - when: on_player_damaged
          condition: {kind: combat, source_shikigami: self, amount_ge: 6}
          steps:
            - {op: draw, count: 1}
            - {op: heal, amount: {event: amount, half: true},
               target: {kind: all, pool: self_player}}
      text: "若本次攻击造成的战斗伤害>=6，你抽一张牌并获得等同于一半伤害的生命。"
