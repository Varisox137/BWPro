        # 处理，落点偏差备注）
        - id: clear
          target: {kind: choose, pool: any_character}
          effects:
            steps:
              - {op: clear_boosts}
          text: 清除一个牌手的出击加成效果
      text: "[瞬发]。使一个式神的力量、生命变为基础值，清除他的护甲与破甲；或清除一个牌手的出击加成效果。"
