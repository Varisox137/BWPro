id: 10020208
name: 惊鸿之舞
versions:
  best: 20200327
  history:
    - date: 20200327  # 发布日期
      card_type: form
      rarity: SSR
      level: 3
      form_power: 7
      form_health: 7
      effects:
        steps: []
      abilities:
        # 每个回合开始时，随机触发一个效果（无 condition = 双方回合开始均触发；
        # random_branch 逐项求值 condition，从通过者中均等随机一项执行）。
        # raw 效果清单（card_data_raw.md L836-855，括注 = 触发前置）：
        #  1 复活所有己方式神。（仅在己方有气绝式神时才可能触发）
        #  2 己方牌手获得8点护甲。（仅在敌方回合开始时、且己方牌手生命<=10时才可能触发）
        #  3 己方牌手恢复6点生命。（仅在己方牌手已损生命>=6时才可能触发）
        #  4 所有己方式神本回合获得[帷幕]和[不屈]。
        #  5 [眩晕]一名敌方力量最高的式神。
        #  6 所有敌方式神降低2点力量。
        #  7 所有敌方式神获得3点破甲。
        #  8 抽一张牌。
        #  9 获得1点鬼火。
        # 10 召唤"烬染不夜"。
        # 11 所有己方式神获得1力量、1生命和1护甲。
        # 12 己方战斗区式神获得2力量、2生命和2护甲。（仅在己方战斗区有式神时才可能触发）
        # 13 己方一名力量最高的式神获得2力量和[贯通]。
        # 14 随机两名己方式神永久获得1力量与1生命。
        # 15 所有己方式神获得[迅捷]。
        # 16 对所有敌方式神造成2点伤害。
        # 17 对敌方牌手造成4点伤害。
        # 18 [投射]：{造成5点伤害}。
        # 19 [鼓舞]：{获得+2战力、+2护甲和一个随机效果}。（仅在己方回合开始时才可能触发）
        #    随机关键字效果：[不屈]；[吸血]；[远程]；[必杀]；[贯通]；[连击]。
        - when: on_turn_start
          steps:
            - op: random_branch
              branches:
                # 1 复活所有己方式神（仅己方有气绝式神时）
                - condition: {friendly_defeated_exists: true}
                  steps:
                    - {op: revive, target: {kind: all, pool: friendly_defeated}}
                # 2 己方牌手获得8点护甲（仅敌方回合开始且己方牌手生命<=10 时）
                - condition: {active: opponent, player_health_le: 10}
                  steps:
                    - {op: gain_shield, amount: 8, target: {kind: all, pool: self_player}}
                # 3 己方牌手恢复6点生命（仅己方牌手已损生命>=6 时）
                - condition: {player_missing_health_ge: 6}
                  steps:
                    - {op: heal, amount: 6, target: {kind: all, pool: self_player}}
                # 4 所有己方式神本回合获得[帷幕]和[不屈]
                - condition: null
                  steps:
                    - {op: grant_keyword, keyword: veil, scope: turn,
                       target: {kind: all, pool: friendly_shikigami}}
                    - {op: grant_keyword, keyword: unyielding, scope: turn,
                       target: {kind: all, pool: friendly_shikigami}}
                # 5 [眩晕]一名敌方力量最高的式神（并列最高均等随机取一）
                - condition: null
                  steps:
                    - {op: stun,
                       target: {kind: all, pool: enemy_shikigami, highest_power: true, random: 1}}
                # 6 所有敌方式神降低2点力量（暂定永久：perm 记账，复活保留）
                - condition: null
                  steps:
                    - {op: buff_power, amount: -2, perm: true,
                       target: {kind: all, pool: enemy_shikigami}}
                # 7 所有敌方式神获得3点破甲
                - condition: null
                  steps:
                    - {op: gain_shield, amount: 3, kind: fragile,
                       target: {kind: all, pool: enemy_shikigami}}
                # 8 抽一张牌
                - condition: null
                  steps:
                    - {op: draw, count: 1}
                # 9 获得1点鬼火
                - condition: null
                  steps:
                    - {op: gain_orb, amount: 1}
                # 10 召唤"烬染不夜"
                - condition: null
                  steps:
                    - {op: summon, shikigami: 10020299}
                # 11 所有己方式神获得1力量、1生命和1护甲（非"本回合"限定：临时修正，气绝清除）
                - condition: null
                  steps:
                    - {op: buff_power, amount: 1,
                       target: {kind: all, pool: friendly_shikigami}}
                    - {op: buff_health, amount: 1,
                       target: {kind: all, pool: friendly_shikigami}}
                    - {op: gain_shield, amount: 1,
                       target: {kind: all, pool: friendly_shikigami}}
                # 12 己方战斗区式神获得2力量、2生命和2护甲（仅己方战斗区有式神时）
                - condition: {combat_occupied: friendly}
                  steps:
                    - {op: buff_power, amount: 2,
                       target: {kind: all, pool: friendly_combat}}
                    - {op: buff_health, amount: 2,
                       target: {kind: all, pool: friendly_combat}}
                    - {op: gain_shield, amount: 2,
                       target: {kind: all, pool: friendly_combat}}
                # 13 己方一名力量最高的式神获得2力量和[贯通]（并列最高均等随机取一）
                - condition: null
                  steps:
                    - {op: buff_power, amount: 2,
                       target: {kind: all, pool: friendly_shikigami, highest_power: true, random: 1}}
                    - {op: grant_keyword, keyword: piercing,
                       target: {kind: all, pool: friendly_shikigami, highest_power: true, random: 1}}
                # 14 随机两名己方式神永久获得1力量与1生命
                - condition: null
                  steps:
                    - {op: buff_power, amount: 1, perm: true,
                       target: {kind: all, pool: friendly_shikigami, random: 2}}
                    - {op: buff_health, amount: 1, perm: true,
                       target: {kind: all, pool: friendly_shikigami, random: 2}}
                # 15 所有己方式神获得[迅捷]（一次性关键字，天然消耗语义，无 scope）
                - condition: null
                  steps:
                    - {op: grant_keyword, keyword: haste,
                       target: {kind: all, pool: friendly_shikigami}}
                # 16 对所有敌方式神造成2点伤害
                - condition: null
                  steps:
                    - {op: damage, amount: 2, target: {kind: all, pool: enemy_shikigami}}
                # 17 对敌方牌手造成4点伤害
                - condition: null
                  steps:
                    - {op: damage, amount: 4, target: {kind: all, pool: enemy_player}}
                # 18 [投射]：{造成5点伤害}
                - condition: null
                  steps:
                    - {op: damage, amount: 5, target: {kind: all, pool: projectile}}
                # 19 [鼓舞]：{获得+2战力、+2护甲和一个随机效果}（仅己方回合开始时）；
                #    随机关键字池 = [不屈]/[吸血]/[远程]/[必杀]/[贯通]/[连击]
                - condition: {active: self}
                  steps:
                    - {op: basic_boost, power: 2, shield: 2,
                       keyword_random: [unyielding, lifesteal, remote, lethal, piercing, combo]}
      text: "每个回合开始时，随机触发一个效果。"
