  history:
    - date: 20200327
      card_type: form
      rarity: SR
      level: 2
      form_power: 2
      form_health: 6
      keywords: [remote]
      effects:
        steps: []
      abilities:
        # 仅"因出击而发起攻击"时（战斗准备前 origin=assault 门控），该出击式神获得
        # 延迟能力：其对敌方牌手造成战斗伤害时抽1（scope=turn+uses=99 本回合内不限次、
        # unique 同卡重复出击替换不叠加；觉醒·鸦天狗移动插入攻击同为该式神的战斗
        # 伤害同样抽，未觉醒投射为效果伤害不抽——全卡盘点）
        - when: on_before_battle_prep
          condition: {attacker_side: friendly, origin: assault}
          steps:
            - op: delay_grant
              bind: target
              target: {kind: context, key: attacker}
              when: on_player_damaged
              condition: {player: opponent, kind: combat, source_shikigami: self}
              scope: turn
              uses: 99
              unique: true
              steps:
                - {op: draw, count: 1}
      text: "[远程]。当己方式神出击并对敌方牌手造成伤害时，抽一张牌。"
