id: 10020603
name: 声东击西
versions:
  best: 20200327
  history:
    - date: 20200327  # 发布日期
      card_type: combat
      rarity: R
      level: 1
      keywords: [trigger]
      play_condition: {enemy_alive_exists: true}  # 使用条件"敌方有未气绝式神"（全卡盘点(16)）
      effects:
        # 主动使用：本次交战镰鼬的伤害对象改向另一个随机敌方角色（battle_retarget：
        # 可含牌手、排除原交战目标；敌方战斗区无式神时默认交战目标=牌手，改向后
        # 即"随机一名未气绝敌方式神"——非主动指定故可命中帷幕）+ 本次战斗免疫战斗
        # 伤害（battle_immunity 绑定当前战斗）
        steps:
          - {op: battle_retarget, target: {kind: self}}
          - {op: battle_immunity, target: {kind: self}}
      response:
        # [响应]：当镰鼬被攻击时自动使用——终止触发响应的原战斗（cancel_attack 置
        # 取消旗标，原战斗在响应结算后终止：先攻/连击/交战均不结算，on_after_assault/
        # on_battle_end 不发），然后以此牌增益（免疫战斗伤害——next_battle 挂账，
        # 新战斗开始消费）对发起攻击者以外的一名未气绝敌方角色发起新攻击
        # （launch_attack at=other_enemy：随机、含敌方牌手；因敌方效果镰鼬被己方
        # 式神攻击时也可响应，此时目标池 = 任一未气绝敌方角色——全卡盘点(16)）
        when: on_before_assault
        condition: {victim_side: friendly, victim_shikigami: 100206}
        steps:
          - {op: cancel_attack}
          - {op: grant_immunity, kind: combat_damage, scope: next_battle, target: {kind: self}}
          - {op: launch_attack, at: other_enemy}
      text: "镰鼬本次的交战目标改为另一个敌方角色并免疫战斗伤害。[响应]：{当镰鼬被攻击时，自动使用此牌。}"
